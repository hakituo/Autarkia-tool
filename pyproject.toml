[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autarkia"
version = "0.1.1"
description = "Tool governance for AI agents: registry, risk levels, role-based access, visibility rules, and execution guards. The tool layer of the Autarkia agent runtime."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shihao Qi", email = "qishihao512@gmail.com" },
]
keywords = [
    "agent",
    "tools",
    "tool-registry",
    "tool-governance",
    "llm",
    "function-calling",
    "role-based-access",
    "autarkia",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://qishihao.icu/projects/autarkia"
Repository = "https://github.com/hakituo/autarkia-tool"
"Autarkia Runtime" = "https://github.com/hakituo/Autarkia"
Author = "https://qishihao.icu"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/autarkia"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
